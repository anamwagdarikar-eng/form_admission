services:
  - type: web
    name: form-admission
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: form-admission-db
          property: connectionString

databases:
  - name: form-admission-db